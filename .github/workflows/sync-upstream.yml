name: Sync fork with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fork_branch:
        description: Fork branch to update (empty uses the default branch)
        type: string
        default: ""
      upstream_branch:
        description: Upstream branch to merge
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: fork-sync-${{ github.repository }}-${{ inputs.fork_branch || github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      FORK_BRANCH: ${{ inputs.fork_branch || github.event.repository.default_branch }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
      HAS_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
    steps:
      - name: Check out the selected fork branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Prepare the upstream source merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$FORK_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/gastownhall/gascity.git
          git fetch --quiet --no-tags --unshallow origin "refs/heads/$FORK_BRANCH"
          SYNC_UPSTREAM_MODE=prepare bash scripts/sync-upstream.sh
          if git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then
            if [[ "$HAS_SYNC_TOKEN" != true ]] && ! git diff --cached --quiet -- '.github/workflows/*.yml' '.github/workflows/*.yaml'; then
              echo '::error::Upstream changed workflow files. Add the FORK_SYNC_TOKEN Actions secret with repository Contents and Workflows write permissions before syncing.'
              exit 1
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Fork is already up to date; no build or push needed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up the merged source's Go version for Make
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up the merged source's Node version
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: internal/api/dashboardspa/web/package-lock.json

      - name: Rebuild the combined dashboard and finish the merge
        if: steps.merge.outputs.changed == 'true'
        run: SYNC_UPSTREAM_MODE=finish make sync-upstream

      - name: Check the visualization against the merged source
        if: steps.merge.outputs.changed == 'true'
        working-directory: internal/api/dashboardspa/web
        run: |
          npm run typecheck
          npm run --workspace gas-city-dashboard-frontend typecheck:test
          npm run --workspace gas-city-dashboard-frontend test -- src/city

      - name: Push the integrated fork
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin "HEAD:refs/heads/$FORK_BRANCH"
          echo 'Upstream merged, dashboard rebuilt and checked, and fork updated.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain an unsuccessful sync
        if: failure()
        run: |
          echo 'Sync stopped. Review source conflicts, build/check failures, or repository token permissions. No force push is used.' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep inherited workflows disabled on this fork
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active" and .path != ".github/workflows/sync-upstream.yml") | .id' |
          while IFS= read -r workflow_id; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow_id/disable"
          done
